name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify tagged source and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - name: Validate requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?', tag):
              raise SystemExit('Expected an existing semantic version tag.')
          PY
      - name: Check out the complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and publication privacy
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -B scripts/check-public.py --history
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          import subprocess
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['GITHUB_SHA']:
              raise SystemExit('Dispatch this workflow from the version tag so provenance matches the built source.')
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('The source version and release tag must match.')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('tag=v' + version + '\n')
          PY
      - name: Build isolated toolchain and Niri
        run: docker build --tag niri-bridge-build:release --file packaging/ubuntu26.04.Dockerfile .
      - name: Test, audit and package
        run: |
          mkdir dist
          docker run --rm --env NIRI_BRIDGE_CI=1 \
            --mount type=bind,source="$PWD",target=/input,readonly \
            --mount type=bind,source="$PWD/dist",target=/output \
            niri-bridge-build:release bash /input/scripts/container-ci.sh
      - name: Retain verified assets
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Attest assets and prepare draft
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download this build's verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Attest public release archives
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; existing assets were preserved.' >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Early beta for Ubuntu 26.04, Niri 26.04 and Linux x86_64.

          Download the Ubuntu amd64 `.deb` package and verify it with SHA256SUMS. Open it with your system package installer, then open NiriBridge from the application launcher. The portable archive remains available with `python3 scripts/install.py`. Install the same version on both computers.

          Opening the interface leaves sharing stopped. Click Start sharing on both computers when ready. Quitting from the tray stops sharing. Upgrades preserve settings and identities and automatically back up the previous application files.

          The corresponding-source archive contains the locked Rust dependencies. See README and CHANGELOG for features, setup instructions, recovery and known limitations.

          This draft contains assets that passed CI, privacy checks, dependency auditing and non-root installation tests. Check the release details before publishing it.
          NOTES
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft "${flags[@]}" \
            --title "NiriBridge $RELEASE_TAG" --notes-file release-notes.md
