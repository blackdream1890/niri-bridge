# Illustrative logical geometry for check-layout, not a live device configuration.
# Read current Niri outputs before defining a real layout.

[[screens]]
device = "desktop"
output = "main"
rect = { x = 0, y = 0, width = 2560, height = 1440 }

[[screens]]
device = "desktop"
output = "portrait"
rect = { x = -1440, y = -560, width = 1440, height = 2560 }

[[screens]]
device = "laptop"
output = "internal"
rect = { x = 0, y = 0, width = 1920, height = 1200 }

[link.a]
device = "desktop"
output = "main"
boundary = { edge = "bottom", start = 0.1, end = 0.5 }

[link.b]
device = "laptop"
output = "internal"
boundary = { edge = "top", start = 0.0, end = 1.0 }
